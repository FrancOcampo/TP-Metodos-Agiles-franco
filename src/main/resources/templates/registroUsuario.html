<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Registrar usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .header-sfc {
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(22,199,154,0.08);
      padding: 18px 0 18px 40px;
      display: flex;
      align-items: center;
      margin-bottom: 40px;
    }
    .header-sfc img {
      height: 80px;
      width: auto;
    }
    .form-card {
      background: #fff;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    h2 {
      color: #16c79a;
      margin-bottom: 28px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    label.invalid::after {
      content: '*';
      color: red;
      margin-left: 4px;
    }
    input[type="text"],
    input[type="password"] {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fdfdfd;
    }
    .input-error {
      border: 2px solid red !important;
    }
    .error-message {
      color: red;
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }
    .btn {
      display: block;
      margin: 30px auto 0;
      background-color: #16c79a;
      color: white;
      padding: 12px 24px;
      font-size: 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      background-color: #13b088;
    }
  </style>
</head>
<body>

  <div class="header-sfc">
    <img src="/logo-sfc.png" alt="Santa Fe Capital Logo">
  </div>

  <div class="form-card">
    <form id="altaUsuarioForm" onsubmit="return enviarFormularioUsuario(event)" novalidate>
      <h2>Registrar usuario</h2>

      <div class="form-group">
        <label for="nombreUsuario" class="invalid">Nombre de usuario</label>
        <input type="text" id="nombreUsuario" name="nombreUsuario" required maxlength="30">
        <div class="error-message" id="error-nombreUsuario"></div>
      </div>

      <div class="form-group">
        <label for="contrasena" class="invalid">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="6">
        <div class="error-message" id="error-contrasena"></div>
      </div>

      <button class="btn" type="submit">Registrar usuario</button>
    </form>
  </div>

  <script>
    function mostrarErrorCampo(campo, idErrorDiv, mensaje) {
      campo.classList.add('input-error');
      const errorDiv = document.getElementById(idErrorDiv);
      if (errorDiv) {
        errorDiv.textContent = mensaje;
        errorDiv.style.display = 'block';
      }
    }

    function limpiarErrores() {
      const campos = document.querySelectorAll('#altaUsuarioForm input');
      campos.forEach(campo => campo.classList.remove('input-error'));
      const errores = document.querySelectorAll('.error-message');
      errores.forEach(div => {
        div.textContent = '';
        div.style.display = 'none';
      });
    }

    async function enviarFormularioUsuario(event) {
      event.preventDefault();
      limpiarErrores();

      if (!validarFormularioUsuario()) return false;

      const data = {
        nombreUsuario: document.getElementById('nombreUsuario').value.trim(),
        contrasena: document.getElementById('contrasena').value
      };

      try {
        const response = await fetch('/api/usuarios/registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          alert('Usuario registrado exitosamente.');
          document.getElementById('altaUsuarioForm').reset();
        } else {
          const errorData = await response.json();

          if (errorData.message && errorData.message.toLowerCase().includes('nombre de usuario ya está registrado')) {
            mostrarErrorCampo(
              document.getElementById('nombreUsuario'),
              'error-nombreUsuario',
              errorData.message
            );
          } else {
            alert(errorData.message || 'Error al registrar el usuario');
          }
        }
      } catch (error) {
        alert(error.message);
      }
    }

    function validarFormularioUsuario() {
      const nombreUsuario = document.getElementById('nombreUsuario');
      const contrasena = document.getElementById('contrasena');
      let valido = true;

      if (nombreUsuario.value.trim() === '' || contrasena.value.trim() === '') {
        alert('Por favor, complete todos los campos obligatorios.');
        if (nombreUsuario.value.trim() === '') mostrarErrorCampo(nombreUsuario, 'error-nombreUsuario', 'El nombre de usuario es obligatorio.');
        if (contrasena.value.trim() === '') mostrarErrorCampo(contrasena, 'error-contrasena', 'La contraseña es obligatoria.');
        return false;
      }

      limpiarErrores();

      if (!/^[A-Za-z0-9]+$/.test(nombreUsuario.value)) {
        mostrarErrorCampo(nombreUsuario, 'error-nombreUsuario', 'El nombre de usuario sólo puede contener letras y números.');
        valido = false;
      }

      if (contrasena.value.length < 6) {
        mostrarErrorCampo(contrasena, 'error-contrasena', 'La contraseña debe tener al menos 6 caracteres.');
        valido = false;
      } else if (!/^[A-Za-z0-9]+$/.test(contrasena.value)) {
        mostrarErrorCampo(contrasena, 'error-contrasena', 'La contraseña sólo puede contener letras y números.');
        valido = false;
      }

      if (!valido) return false;

      return confirm('¿Está seguro de que desea registrar este usuario?');
    }

  </script>
</body>
</html>
